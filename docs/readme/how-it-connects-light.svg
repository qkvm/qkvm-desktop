<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="How qKVM Desktop connects: one native process speaks to each device directly"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#e9f0fb"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.0" r="0.75"><stop offset="0" stop-color="#0b6bff" stop-opacity="0.10"/><stop offset="1" stop-color="#0b6bff" stop-opacity="0"/></radialGradient><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient><linearGradient id="wallB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="0.6" stop-color="#2563eb"/><stop offset="1" stop-color="#4338ca"/></linearGradient><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs><rect x="0" y="0" width="1280" height="600" rx="18" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="600" rx="18" fill="url(#glow)"/><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b6bff"/></marker><text x="640.0" y="54" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">One program, straight to your devices</text><text x="640.0" y="82" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#5b6577" text-anchor="middle">No cloud in between, no relay, no local server</text><g filter="url(#shadow)"><rect x="64" y="118" width="470" height="418" rx="16" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/></g><rect x="88" y="142" width="13.2" height="13.2" rx="2.904" fill="#5b9bff" opacity="0.55"/><rect x="104.8" y="142" width="13.2" height="13.2" rx="2.904" fill="#5b9bff" opacity="0.55"/><rect x="88" y="158.8" width="13.2" height="13.2" rx="2.904" fill="#5b9bff" opacity="0.55"/><rect x="104.8" y="158.8" width="13.2" height="13.2" rx="2.904" fill="#0b6bff"/><text x="130" y="164" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">qKVM Desktop</text><text x="130" y="184" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6577" text-anchor="start">One native Windows process, C++20 and Qt 6</text><rect x="86" y="214" width="426" height="62" rx="10" fill="#f3f6fb" stroke="#d6dde8" stroke-width="1"/><rect x="86" y="214" width="5" height="62" rx="2.5" fill="#0b6bff"/><text x="106" y="240" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Interface</text><text x="106" y="261" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start">Qt Quick: the web page's look and words, drawn natively</text><rect x="86" y="290" width="426" height="62" rx="10" fill="#f3f6fb" stroke="#d6dde8" stroke-width="1"/><rect x="86" y="290" width="5" height="62" rx="2.5" fill="#0b6bff"/><text x="106" y="316" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Video engine</text><text x="106" y="337" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start">H.264 and JPEG, decoded on the graphics card</text><rect x="86" y="366" width="426" height="62" rx="10" fill="#f3f6fb" stroke="#d6dde8" stroke-width="1"/><rect x="86" y="366" width="5" height="62" rx="2.5" fill="#0b6bff"/><text x="106" y="392" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Device drivers</text><text x="106" y="413" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start">kvmd, JetKVM over WebRTC, Redfish, server consoles</text><rect x="86" y="442" width="426" height="62" rx="10" fill="#f3f6fb" stroke="#d6dde8" stroke-width="1"/><rect x="86" y="442" width="5" height="62" rx="2.5" fill="#0b6bff"/><text x="106" y="468" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Your secrets</text><text x="106" y="489" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5b6577" text-anchor="start">Windows Credential Manager, behind an app password</text><g filter="url(#shadow)"><rect x="806" y="126" width="410" height="112" rx="14" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/></g><text x="828" y="162" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">IP KVMs</text><text x="828" y="186" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6577" text-anchor="start">GL.iNet Comet, PiKVM-style KVMs, JetKVM</text><rect x="828" y="200" width="188.9" height="24" rx="12" fill="#0b6bff" opacity="0.12"/><text x="836" y="216" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0b6bff" text-anchor="start">HTTPS, WebSocket and WebRTC</text><path d="M534 327.0 C 674 327.0, 666 182, 802 182" fill="none" stroke="#0b6bff" stroke-width="2.2" marker-end="url(#arrow)" opacity="0.9"/><g filter="url(#shadow)"><rect x="806" y="266" width="410" height="112" rx="14" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/></g><text x="828" y="302" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Server controllers</text><text x="828" y="326" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6577" text-anchor="start">Redfish BMCs, and the console of AMI MegaRAC</text><rect x="828" y="340" width="255.9" height="24" rx="12" fill="#0b6bff" opacity="0.12"/><text x="836" y="356" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0b6bff" text-anchor="start">HTTPS, each pinned to its certificate</text><path d="M534 327.0 C 674 327.0, 666 322, 802 322" fill="none" stroke="#0b6bff" stroke-width="2.2" marker-end="url(#arrow)" opacity="0.9"/><g filter="url(#shadow)"><rect x="806" y="406" width="410" height="112" rx="14" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/></g><text x="828" y="442" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">A qKVM server (optional)</text><text x="828" y="466" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6577" text-anchor="start">Its wall, accounts, history and virtual media</text><rect x="828" y="480" width="215.70000000000002" height="24" rx="12" fill="#0b6bff" opacity="0.12"/><text x="836" y="496" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0b6bff" text-anchor="start">Signed in, version 0.3 or later</text><path d="M534 327.0 C 674 327.0, 666 462, 802 462" fill="none" stroke="#0b6bff" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#arrow)" opacity="0.9"/><text x="670.0" y="140" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Direct, over your LAN</text><text x="670.0" y="160" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5b6577" text-anchor="middle">or Tailscale</text><rect x="292.59999999999997" y="556" width="89.2" height="30" rx="15" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/><circle cx="307.59999999999997" cy="571" r="4" fill="#16a34a"/><text x="317.59999999999997" y="576" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">No cloud</text><rect x="395.79999999999995" y="556" width="163.20000000000002" height="30" rx="15" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/><circle cx="410.79999999999995" cy="571" r="4" fill="#16a34a"/><text x="420.79999999999995" y="576" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">No account with us</text><rect x="573.0" y="556" width="266.8" height="30" rx="15" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/><circle cx="588.0" cy="571" r="4" fill="#16a34a"/><text x="598.0" y="576" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Each password only to its device</text><rect x="853.8" y="556" width="133.60000000000002" height="30" rx="15" fill="#ffffff" stroke="#d6dde8" stroke-width="1"/><circle cx="868.8" cy="571" r="4" fill="#16a34a"/><text x="878.8" y="576" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Signed updates</text></svg>
